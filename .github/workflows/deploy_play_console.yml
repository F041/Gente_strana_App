name: Deploy to Google Play Console

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release

jobs:
  deploy:
    name: Build & Deploy to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Create google-services.json from Secret
        env:
          G_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$G_SERVICES_CONTENT" | base64 --decode > app/google-services.json 2>/dev/null || echo "$G_SERVICES_CONTENT" > app/google-services.json

      - name: Build Android App Bundle (AAB) with Auto-Incremented VersionCode
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          AUTO_VERSION_CODE=$(( 100 + BUILD_NUMBER ))
          ./gradlew :app:bundleRelease -PversionCode=$AUTO_VERSION_CODE -PversionName="1.0.$AUTO_VERSION_CODE"

      - name: Sign App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          else
            keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias gentestrana_key -storepass android -keypass android -dname "CN=Gentestrana, OU=Dev, O=Gentestrana, L=Rome, C=IT"
            jarsigner -keystore release.jks -storepass android -keypass android app/build/outputs/bundle/release/app-release.aab gentestrana_key
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play Console Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.gentestrana
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
