name: Deploy to Google Play Console

on:
  push:
    branches:
      - master
      - main
      - release

jobs:
  deploy:
    name: Build & Deploy to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB) with Auto-Incremented VersionCode
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          AUTO_VERSION_CODE=$(( 100 + BUILD_NUMBER ))
          ./gradlew :app:bundleRelease -PversionCode=$AUTO_VERSION_CODE -PversionName="1.0.$AUTO_VERSION_CODE"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play Console Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.gentestrana
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
